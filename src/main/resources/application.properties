# =========================================================
# CarePulse Hospital Appointment Scheduling System
# Spring Boot Configuration
# =========================================================

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Application Details
spring.application.name=hospital-appointment-system

# Database Configuration (Runs out-of-the-box on H2 MySQL Mode or connects to MySQL)
spring.datasource.url=jdbc:h2:file:./hospital_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Static Resources
spring.web.resources.static-locations=classpath:/static/
